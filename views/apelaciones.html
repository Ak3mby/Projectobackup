<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Apelaciones</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">B</div><span class="brand-name">booleanware</span></div><nav>
<a class="nav-item" href="/"><i class="ti ti-shield-search"></i>Veredictos</a><a class="nav-item" href="/sanciones.html"><i class="ti ti-gavel"></i>Sanciones</a><a class="nav-item active" href="/apelaciones.html"><i class="ti ti-message-report"></i>Apelaciones</a><a class="nav-item" href="/reportes.html"><i class="ti ti-chart-bar"></i>Reportes</a><a class="nav-item" href="/auditoria.html"><i class="ti ti-history"></i>Auditoría</a><a class="nav-item" href="/integracion-api.html"><i class="ti ti-plug"></i>Integración API</a><a class="nav-item" href="/configuracion.html"><i class="ti ti-settings"></i>Configuración</a></nav></aside>
<main class="content-page"><div class="main-header"><div><h1>Apelaciones</h1><p class="subtitle">Solicitudes pendientes de revisión</p></div></div><div class="table-wrap"><table><thead><tr><th>Jugador</th><th>Motivo</th><th>Estado</th><th>Fecha</th><th>Acción</th></tr></thead><tbody id="rows"></tbody></table></div></main></div>
<script>fetch('/api/appeals').then(r=>r.json()).then(rows=>{document.getElementById('rows').innerHTML=rows.map(row=>`<tr><td class="mono">${row.player}</td><td class="cell-secondary">${row.reason}</td><td class="status ${row.status}">${row.status}</td><td class="cell-secondary mono">${row.created_at}</td><td class="action-cell">${row.status==='pending'?`<button onclick="review(${row.id}, 'approved')">Aprobar</button> <button onclick="review(${row.id}, 'rejected')">Rechazar</button>`:'—'}</td></tr>`).join('')});function review(id,status){fetch('/api/appeals/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})}).then(()=>location.reload())}</script></body></html>

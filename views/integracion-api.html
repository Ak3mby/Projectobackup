<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Integración API</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">B</div><span class="brand-name">booleanware</span></div><nav><a class="nav-item" href="/"><i class="ti ti-shield-search"></i>Veredictos</a><a class="nav-item" href="/sanciones.html"><i class="ti ti-gavel"></i>Sanciones</a><a class="nav-item" href="/apelaciones.html"><i class="ti ti-message-report"></i>Apelaciones</a><a class="nav-item" href="/reportes.html"><i class="ti ti-chart-bar"></i>Reportes</a><a class="nav-item" href="/auditoria.html"><i class="ti ti-history"></i>Auditoría</a><a class="nav-item active" href="/integracion-api.html"><i class="ti ti-plug"></i>Integración API</a><a class="nav-item" href="/configuracion.html"><i class="ti ti-settings"></i>Configuración</a></nav></aside>
<main class="content-page"><div class="main-header"><div><h1>Integración API</h1><p class="subtitle">Servicios conectados y última sincronización</p></div></div><div class="table-wrap"><table><thead><tr><th>Servicio</th><th>Endpoint</th><th>Estado</th><th>Última sincronización</th></tr></thead><tbody id="rows"></tbody></table></div></main></div>
<script>fetch('/api/external').then(r=>r.json()).then(rows=>{document.getElementById('rows').innerHTML=rows.map(row=>`<tr><td>${row.name}</td><td class="mono cell-secondary">${row.endpoint}</td><td class="status ${row.status}">${row.status}</td><td class="cell-secondary mono">${row.last_sync||'—'}</td></tr>`).join('')})</script></body></html>

<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Configuración</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">B</div><span class="brand-name">booleanware</span></div><nav><a class="nav-item" href="/"><i class="ti ti-shield-search"></i>Veredictos</a><a class="nav-item" href="/sanciones.html"><i class="ti ti-gavel"></i>Sanciones</a><a class="nav-item" href="/apelaciones.html"><i class="ti ti-message-report"></i>Apelaciones</a><a class="nav-item" href="/reportes.html"><i class="ti ti-chart-bar"></i>Reportes</a><a class="nav-item" href="/auditoria.html"><i class="ti ti-history"></i>Auditoría</a><a class="nav-item" href="/integracion-api.html"><i class="ti ti-plug"></i>Integración API</a><a class="nav-item active" href="/configuracion.html"><i class="ti ti-settings"></i>Configuración</a></nav></aside>
<main class="content-page"><div class="main-header"><div><h1>Configuración</h1><p class="subtitle">Valores operativos guardados en la base de datos</p></div></div><form id="config-form" class="inline-form"><input name="game_name" placeholder="Nombre del juego"><input name="api_version" placeholder="Versión de API"><input name="alert_threshold" type="number" placeholder="Umbral de alerta"><button type="submit">Guardar</button></form></main></div>
<script>fetch('/api/config').then(r=>r.json()).then(config=>{for(const [key,value] of Object.entries(config)){const input=document.querySelector(`[name="${key}"]`);if(input)input.value=value}});document.getElementById('config-form').addEventListener('submit',event=>{event.preventDefault();fetch('/api/config',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(event.target)))}).then(()=>alert('Configuración guardada'))})</script></body></html>
